<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATOM — Starting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; background: #0d0d0d; color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .logo {
      width: 80px; height: 80px; border-radius: 18px;
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; margin-bottom: 24px;
      box-shadow: 0 0 40px rgba(99,102,241,0.4);
    }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    p  { margin-top: 8px; color: #666; font-size: 14px; }
    .dots { display: inline-flex; gap: 6px; margin-top: 32px; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #6366f1; animation: pulse 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,80%,100% { opacity: 0.2; transform: scale(0.8); }
                       40% { opacity: 1; transform: scale(1); } }
    .error { display: none; margin-top: 20px; color: #ef4444; font-size: 13px; text-align: center; }
    .retry { margin-top: 12px; padding: 8px 20px; background: #6366f1; color: white;
             border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .retry:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="logo">⚛</div>
  <h1>ATOM</h1>
  <p>Connecting to local service...</p>
  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="error" id="err">
    Could not connect to ATOM backend at <code>localhost:5051</code>.<br>
    Make sure the services are running.
    <br><button class="retry" onclick="tryConnect()">Retry</button>
  </div>

  <script>
    const TARGET = 'http://localhost:5051';
    let attempts = 0;

    async function tryConnect() {
      document.getElementById('err').style.display = 'none';
      attempts++;
      try {
        const res = await fetch(TARGET, { mode: 'no-cors' });
        window.location.href = TARGET;
      } catch (e) {
        if (attempts < 20) {
          setTimeout(tryConnect, 1500);
        } else {
          document.getElementById('err').style.display = 'block';
        }
      }
    }

    // Start polling immediately
    tryConnect();
  </script>
</body>
</html>
