name: HF Docker Smoke

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - .dockerignore
      - README.md
      - frontend-nextjs/**
      - backend/**
      - .github/workflows/hf-docker-smoke.yml
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t annator-hf-smoke .

      - name: Run container
        run: |
          docker run -d --name annator-hf-smoke -p 7860:7860 annator-hf-smoke
          sleep 20
          docker ps -a

      - name: Smoke test public port
        run: |
          curl --fail --show-error --silent --retry 10 --retry-delay 3 http://127.0.0.1:7860/ > /tmp/annator-home.html
          test -s /tmp/annator-home.html

      - name: Container logs
        if: always()
        run: docker logs annator-hf-smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f annator-hf-smoke || true
